<script>"use strict";
const APP_VERSION="11.5.0";
// A small suggestion list at the caret, driven from the keyboard while typing continues in the editor.
// Used by the slash menu ("/" at the start of a line) and by [[ item links.
let caretPopover=null;
const caretPopoverEl=document.createElement('div');caretPopoverEl.className='caretPopover hidden';caretPopoverEl.setAttribute('role','listbox');caretPopoverEl.id='caretPopover';queueMicrotask(()=>document.body.append(caretPopoverEl));
caretPopoverEl.addEventListener('mousedown',e=>e.preventDefault());
function openCaretPopover(kind,node,start,triggerLength,extra={}){caretPopover={kind,node,start,triggerLength,index:0,...extra};updateCaretPopover()}
function closeCaretPopover(){caretPopover=null;caretPopoverEl.classList.add('hidden');caretPopoverEl.replaceChildren()}
function caretPopoverQuery(){
 const p=caretPopover;if(!p)return null;const sel=getSelection();if(!sel?.rangeCount||!sel.isCollapsed)return null;
 const r=sel.getRangeAt(0);if(r.startContainer!==p.node||!p.node.isConnected||r.startOffset<p.start+p.triggerLength)return null;
 return p.node.data.slice(p.start+p.triggerLength,r.startOffset);
}
const SLASH_COMMANDS=[
 ['Heading 1','h1 title','#',' '],['Heading 2','h2 subtitle','##',' '],['Heading 3','h3','###',' '],
 ['Bullet list','ul unordered','-',' '],['Numbered list','ol ordered number','1.',' '],['Checklist','todo task checkbox','[]',' '],
 ['Quote','blockquote','>',' '],['Code block','pre fence','```','Enter'],['Divider','hr line rule','---',' '],
 ['Table','grid columns',()=>insertEditorTable(3,2)],['Link to an item','reference [[',()=>typeAtCaret('[[')],['Embed an item','reference ![[',()=>typeAtCaret('![[')],
 ['Todo in this sentence','inline todo <',()=>typeAtCaret('<')],['Image','picture photo',()=>document.querySelector('#formatMenu [aria-label="Insert image"]')?.click()]
];
function typeAtCaret(text){const sel=getSelection();if(!sel.rangeCount)return;insertTextAtRange(sel.getRangeAt(0),text);$('richEditor').dispatchEvent(new Event('input',{bubbles:true}))}
function caretPopoverChoices(q){
 if(caretPopover.kind==='slash'){const t=q.toLowerCase();return SLASH_COMMANDS.filter(([label,words])=>!t||(label+' '+words).toLowerCase().split(/\s+/).some(w=>w.startsWith(t))||label.toLowerCase().includes(t)).map(c=>({label:c[0],command:c}))}
 const items=rankItems(q?activeItems(db):activeItems(db).slice().sort((a,b)=>inactiveRank(a)-inactiveRank(b)||String(b.updatedAt).localeCompare(String(a.updatedAt))),q).filter(i=>i.id!==selected).slice(0,8).map(i=>({label:i.title||'(untitled)',item:i}));
 if(q.trim()&&!activeItems(db).some(i=>String(i.title||'').trim().toLowerCase()===q.trim().toLowerCase()))for(const type of ['Note','Todo'])items.push({label:'Create '+type+': “'+q.trim()+'”',create:type});
 return items;
}
function updateCaretPopover(){
 const p=caretPopover;if(!p)return;const q=caretPopoverQuery();
 if(q===null||(p.kind==='slash'&&/\s\s|^\s/.test(q))||(p.kind==='reference'&&/\]|\n/.test(q))){closeCaretPopover();return}
 const choices=caretPopoverChoices(q);if(!choices.length&&p.kind==='slash'){closeCaretPopover();return}
 p.choices=choices;p.index=Math.min(p.index,Math.max(0,choices.length-1));
 caretPopoverEl.replaceChildren(...choices.map((c,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.className='caretPopoverItem'+(c.item&&inactiveRank(c.item)?' inactiveResult':'');b.setAttribute('aria-selected',String(i===p.index));
   if(c.item)b.insertAdjacentHTML('afterbegin',itemMarker(c.item,{passive:true}));const span=document.createElement('span');span.textContent=c.label;b.append(span);b.onclick=()=>{p.index=i;chooseCaretPopover()};return b}));
 if(!choices.length){const empty=document.createElement('div');empty.className='caretPopoverEmpty';empty.textContent='No matching items';caretPopoverEl.append(empty)}
 const r=getSelection().getRangeAt(0).cloneRange(),box=(r.getClientRects()[0]||r.startContainer.parentElement.getBoundingClientRect());
 caretPopoverEl.classList.remove('hidden');
 const h=caretPopoverEl.offsetHeight,w=caretPopoverEl.offsetWidth;
 caretPopoverEl.style.left=Math.max(8,Math.min(box.left,innerWidth-w-8))+'px';
 caretPopoverEl.style.top=(box.bottom+6+h<innerHeight?box.bottom+6:Math.max(8,box.top-h-6))+'px';
 caretPopoverEl.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
}
function chooseCaretPopover(){
 const p=caretPopover;if(!p||!p.choices?.length)return;const choice=p.choices[p.index];const sel=getSelection();
 const r=document.createRange();r.setStart(p.node,p.start);r.setEnd(sel.getRangeAt(0).startContainer,sel.getRangeAt(0).startOffset);
 closeCaretPopover();forceRichHistoryCheckpoint();r.deleteContents();sel.removeAllRanges();sel.addRange(r);
 if(choice.command){
   const [,,trigger,key]=choice.command;
   if(typeof trigger==='function'){syncModelFromRich();trigger();return}
   insertTextAtRange(r,trigger);applyMarkdownTypingShortcut({key,ctrlKey:false,metaKey:false,altKey:false,isComposing:false,preventDefault(){}});syncModelFromRich();rememberRichSelection();return;
 }
 let target=choice.item;
 if(choice.create){checkpoint();try{target=createItem(db,choice.create);target.title=choice.label.replace(/^Create (Note|Todo): “|”$/g,'');touch(db,target)}catch(error){toast(error.message);return}}
 const span=makeReferenceElement(target,p.embed);r.insertNode(span);r.setStartAfter(span);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
 syncModelFromRich();rememberRichSelection();if(choice.create){renderTree();renderStatus?.()}
}
function slashTrigger(){
 if(caretPopover||activeTableCell())return;const sel=getSelection();if(!sel?.isCollapsed||!sel.rangeCount||editorComposing)return;
 const range=sel.getRangeAt(0),node=range.startContainer;if(node.nodeType!==3||!rangeBelongsToRichEditor(range))return;
 const block=bodyBlock(node);if(!block||(block.dataset.mdblock||'p')!=='p'||block===$('richEditor').firstElementChild&&rangeTouchesEditorTitleLine?.(range))return;
 if(textBeforeCaretInBlock(block,range)!=='/')return;
 openCaretPopover('slash',node,range.startOffset-1,1);
}
// Registered once the page is built (this script section runs before the editor exists).
queueMicrotask(()=>{$('richEditor').addEventListener('keydown',e=>{
 if(!caretPopover)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();e.stopImmediatePropagation();const n=caretPopover.choices?.length||0;if(n){caretPopover.index=(caretPopover.index+(e.key==='ArrowDown'?1:-1)+n)%n;updateCaretPopover()}}
 else if((e.key==='Enter'||e.key==='Tab')&&caretPopover.choices?.length){e.preventDefault();e.stopImmediatePropagation();chooseCaretPopover()}
 else if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeCaretPopover()}
},true);
document.addEventListener('selectionchange',()=>{if(caretPopover&&caretPopoverQuery()===null)closeCaretPopover()});
$('richEditor').addEventListener('blur',()=>setTimeout(()=>{if(!$('richEditor').contains(document.activeElement))closeCaretPopover()},0));
});
// Selection toolbar: selecting text in the editor shows bold, italic, underline, code and link right above it.
// Each button runs the same command as the formatting menu or its shortcut.
const selectionBar=document.createElement('div');selectionBar.className='selectionBar hidden';selectionBar.setAttribute('role','toolbar');selectionBar.setAttribute('aria-label','Format selection');selectionBar.id='selectionBar';
const SELECTION_TOOLS=[['bold','Bold','Mod+B','<path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/>'],['italic','Italic','Mod+I','<path d="M14 5h-4M14 19h-4M14 5l-4 14"/>'],['underline','Underline','','<path d="M7 5v6a5 5 0 0 0 10 0V5M6 20h12"/>'],['code','Code','','<path d="m9 8-4 4 4 4M15 8l4 4-4 4"/>'],['link','Link','Mod+K','<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>']];
for(const [cmd,label,key,icon] of SELECTION_TOOLS){const b=document.createElement('button');b.type='button';b.dataset.selectionCmd=cmd;b.setAttribute('aria-label',label);if(key)b.dataset.shortcut=key;b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icon+'</svg>';selectionBar.append(b)}
selectionBar.addEventListener('mousedown',e=>e.preventDefault());
selectionBar.addEventListener('mouseover',e=>{const b=e.target.closest('button');if(b&&!b.contains(e.relatedTarget))showFormatTooltip(b)});
selectionBar.addEventListener('mouseout',e=>{const b=e.target.closest('button');if(b&&!b.contains(e.relatedTarget))hideFormatTooltip()});
selectionBar.addEventListener('click',e=>{const b=e.target.closest('[data-selection-cmd]');if(!b)return;hideFormatTooltip();rememberRichSelection();
 if(b.dataset.selectionCmd==='link')openLinkDialog();else document.querySelector('#formatMenu [data-format="'+b.dataset.selectionCmd+'"]')?.onclick?.();
 requestAnimationFrame(paintSelectionBar)});
function paintSelectionBar(){
 const sel=getSelection(),ed=$('richEditor');
 const ok=sel?.rangeCount&&!sel.isCollapsed&&ed&&!sourceMode()&&ed.contains(document.activeElement)&&rangeBelongsToRichEditor(sel.getRangeAt(0))&&!caretPopover&&!activeTableCell()&&!richSelectionTouchesTitleLine()&&!bodyBlock(sel.anchorNode)?.matches?.('[data-mdblock="code"]');
 if(!ok){selectionBar.classList.add('hidden');return}
 for(const b of selectionBar.querySelectorAll('[data-selection-cmd]'))if(b.dataset.selectionCmd!=='link'&&b.dataset.selectionCmd!=='code'){let on=false;try{on=document.queryCommandState(b.dataset.selectionCmd)}catch{}b.setAttribute('aria-pressed',String(on))}
 const r=sel.getRangeAt(0).getBoundingClientRect();selectionBar.classList.remove('hidden');
 const w=selectionBar.offsetWidth,h=selectionBar.offsetHeight;
 selectionBar.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+'px';
 selectionBar.style.top=(r.top-h-8>8?r.top-h-8:r.bottom+8)+'px';
}
let selectionBarQueued=false;
document.addEventListener('selectionchange',()=>{if(selectionBarQueued)return;selectionBarQueued=true;requestAnimationFrame(()=>{selectionBarQueued=false;paintSelectionBar()})});
queueMicrotask(()=>{document.body.append(selectionBar);document.querySelector('.documentScroll')?.addEventListener('scroll',()=>selectionBar.classList.add('hidden'),{passive:true});$('richEditor').addEventListener('blur',()=>setTimeout(paintSelectionBar,0))});

function insertReference(embed=false){
 if(!db||activeTableCell())return;
 restoreRichSelection();
 const sel=window.getSelection();
 const savedRange=sel?.rangeCount&&rangeBelongsToRichEditor(sel.getRangeAt(0))?sel.getRangeAt(0).cloneRange():savedRichRange?.cloneRange()||null;
 if(rangeTouchesEditorTitleLine(savedRange)){rejectTitleFormatting();return}
 chooseReference(embed,(target,meta)=>{
   if(!meta?.created)forceRichHistoryCheckpoint();
   const span=makeReferenceElement(target,embed);
   if(savedRange){
     const currentSel=window.getSelection();savedRange.deleteContents();savedRange.insertNode(span);savedRange.setStartAfter(span);savedRange.collapse(true);currentSel.removeAllRanges();currentSel.addRange(savedRange)
   }else {normalizeRichTitleLine();$("richEditor").lastElementChild.append(span)}
   syncModelFromRich();
   $("richEditor").focus();
   rememberRichSelection();
 },{allowCreate:true});
}
function setSourceMode(source){
 document.querySelector(".documentScroll").classList.toggle("source-document",source);
  document.querySelectorAll(".formatCommands button:not(#sourceToggle)").forEach(b=>b.disabled=source);$("content").classList.toggle("hidden",!source);$("richEditor").classList.toggle("hidden",source);$("sourceToggle").textContent=source?"Rich":"Source";$("sourceToggle").dataset.source=source?"1":"";refreshEditorSidebar();
}
function sourceMode(){return $("sourceToggle").dataset.source==="1"}

let focusBack=[],focusForward=[],focusHistoryCurrent=null,restoringFocusHistory=false;
function historyDocument(id){return itemById(db,id)||db?.planner?.meetings?.[id]}
function focusHistoryState(){return {id:selected,view:editorIsOpen()?'editor':calendarMode==='years'?'targets':'calendar',date:calendarCursorDate,scroll:$('calendarBody').scrollTop}}
function rememberFocusedItem(){
 if(restoringFocusHistory||!db)return;
 if(selected)try{localStorage.setItem('ytnh-last-item-'+db.createdAt,selected)}catch{}
 const state=focusHistoryState();
 if(focusHistoryCurrent?.id===state.id&&focusHistoryCurrent.view===state.view){focusHistoryCurrent=state;return}
 if(focusHistoryCurrent){flushAutosaveOnNavigation();focusBack.push(focusHistoryCurrent);focusBack=focusBack.slice(-5)}
 focusHistoryCurrent=state;focusForward=[];
}
function navigateFocusHistory(forward){
 const from=forward?focusForward:focusBack,to=forward?focusBack:focusForward;
 let state;while(from.length){const candidate=from.pop();if(candidate.view!=='editor'||historyDocument(candidate.id)&&!historyDocument(candidate.id).archived){state=candidate;break}}
 if(!state)return;
 flushAutosaveOnNavigation();rememberEditorLocation();to.push(focusHistoryState());if(to.length>5)to.shift();restoringFocusHistory=true;
 try{
   selected=state.id&&historyDocument(state.id)?state.id:null;multiSelected.clear();
   if(state.view==='editor'){edit(selected);if(editorLocations.has(selected))restoreItemEditorLocation(selected);else focusBodyStart()}
   else{calendarMode=state.view==='targets'?'years':'weeks';if(state.date){calendarCursorDate=state.date;weekAnchor=new Date(state.date+'T12:00:00')}$('layout').dataset.view='calendar';showCalendar();$('calendarBody').scrollTop=state.scroll||0;focusPane('calendar')}
   paintOutlineSelection();focusHistoryCurrent=focusHistoryState();
 }finally{restoringFocusHistory=false}
}
// Suppress WebView page navigation; one release uses the existing app history.
let historyMouseButton=null;
window.addEventListener('mousedown',e=>{if(e.button!==3&&e.button!==4)return;e.preventDefault();e.stopImmediatePropagation();historyMouseButton=e.button},true);
window.addEventListener('mouseup',e=>{
 if(e.button!==3&&e.button!==4)return;e.preventDefault();e.stopImmediatePropagation();
 const matched=historyMouseButton===e.button;historyMouseButton=null;
 if(matched&&!$('modalbg').classList.contains('open')&&!document.querySelector('dialog[open]'))navigateFocusHistory(e.button===4);
},true);
window.addEventListener('auxclick',e=>{if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation()}},true);
window.addEventListener('blur',()=>historyMouseButton=null);
function jumpOutlineBoundary(last,inGroup){
 const active=document.activeElement?.closest?.('.row[data-id]');
 const row=active?.dataset.id===selected?active:$('tree').querySelector(`.row[data-id="${selected}"]`);
 const scope=inGroup?row?.closest('.outlineGroup'):$('tree');if(!scope)return;
 const rows=[...scope.querySelectorAll('.row[data-id]')],target=last?rows.at(-1):rows[0];if(!target)return;
 locationGroup=target.closest('[data-group-key]')?.dataset.groupKey;selectedLocation=target.dataset.location;selected=target.dataset.id;multiSelected.clear();paintOutlineSelection();if(editorIsOpen()||appearance.defaultView==='editor')edit(selected);
 activePane='outline';target.focus({preventScroll:true});target.scrollIntoView({block:'nearest'});
}
let codeSingleClickTimer=null;
let multiSelected=new Set(),selectionAnchor=null,draggedItemIds=[];
function paintTargetSelection(){
 $('calendarBody').querySelectorAll('[data-target-id]').forEach(el=>el.dataset.selected=String(el.dataset.targetId===selected||multiSelected.has(el.dataset.targetId)));
}
let observedCode=null;
function positionOutlineMarker(){

 const code=observedCode.getBoundingClientRect();row.style.setProperty('--code-center',(code.top-row.getBoundingClientRect().top-row.clientTop+code.height/2)+'px');
}
const codeSizeObserver=new ResizeObserver(positionOutlineMarker);
function updateOutlinePaneMarker(preferred=document.activeElement){
 const rows=$('tree').querySelectorAll('.row.currentItem');
 const focused=preferred?.closest?.('.row.currentItem');
 const target=focused||rows[0];
 $('tree').querySelectorAll('.paneMarker').forEach(row=>{if(row!==target)row.classList.remove('paneMarker')});
 target?.classList.add('paneMarker');
 const code=target?.querySelector('.code');if(code!==observedCode){codeSizeObserver.disconnect();observedCode=code;if(code)codeSizeObserver.observe(code)}

}
function paintOutlineSelection(){

 paintTargetSelection();
 rememberFocusedItem();
 const activeLocation=locationRow(selected)?.dataset.location;
 $("tree").querySelectorAll(".row[data-id]").forEach(r=>{const current=r.dataset.id===selected&&(!db?.locations||r.dataset.location===activeLocation);r.classList.toggle("sel",current||(db?.locations&&multiLocations.size?multiLocations.has(r.dataset.location):multiSelected.size>1&&multiSelected.has(r.dataset.id)));r.classList.toggle("currentItem",current);{const v=current?"true":"false";if(r.getAttribute("aria-selected")!==v)r.setAttribute("aria-selected",v)}});updateOutlinePaneMarker();
}
function openSelectedInFullEditor(id){

function visibleOutlineIds(){

function completeSearchAction(id=selected){
 if(!$('search').value)return false;
 $('search').value='';if(!itemById(db,id)||itemById(db,id).archived)id=null;selected=id;
 let item=itemById(db,id),parent=item?.parentId;
 while(parent){const ancestor=itemById(db,parent);if(!ancestor)break;ancestor.collapsed=false;parent=ancestor.parentId}
 if(item)for(const g of outlineGroups([item],currentGroupBy()))collapsedOutlineGroups.delete(currentGroupBy()+'|'+g.key);

function revealOutlineItem(id,{focus=false}={}){

 if(recurrenceViewportHold){renderTree();if(focus)focusOutlineItem(id);return}
 if(db.locations){

 for(const g of outlineGroups([item],currentGroupBy()))collapsedOutlineGroups.delete(currentGroupBy()+'|'+g.key);

// The completed Todo stays in place (ticked, muted, struck through) for two seconds so it can be undone with
// one more click; then its rows fade and collapse, and selection moves on as before.
function startCompletionGrace(item,{candidates=[],wasOpen=false}={}){
 cancelCompletionGrace(item.id);
 const timer=setTimeout(()=>finishCompletionGrace(item.id),2000);
 completionGrace.set(item.id,{timer,candidates,wasOpen});
 if(!patchRender([item.id]))render();if(editorIsOpen()&&selected===item.id)edit(item.id);
 markJustCompleted(item.id);playCompletionSound();
 focusOutlineItem(selected);
}
function cancelCompletionGrace(id){const g=completionGrace.get(id);if(g){clearTimeout(g.timer);completionGrace.delete(id)}}
function finishCompletionGrace(id){

 const [key,code]=MENU_KEYS[last]||(/^Digit(\d)$/.test(last)?[last.slice(5),last]:/^\d$/.test(last)?[last,'Digit'+last]:[mods.has('Shift')?last.toUpperCase():last.toLowerCase(),'Key'+last.toUpperCase()]);
 const mac=IS_MAC,init={key,code,bubbles:true,cancelable:true,metaKey:mac&&mods.has('Mod'),ctrlKey:(!mac&&mods.has('Mod'))||mods.has('Ctrl'),shiftKey:mods.has('Shift'),altKey:mods.has('Alt')};

function adjustTextSize(delta){

 restoreRichSelection();const selection=getSelection();if(!selection.rangeCount)return;
 const range=selection.getRangeAt(0);if(!rangeBelongsToRichEditor(range))return;

   const node=range.startContainer,offset=range.startOffset;
   const left=node.data.slice(0,offset).match(/[\p{L}\p{N}_]+$/u)?.[0].length||0,right=node.data.slice(offset).match(/^[\p{L}\p{N}_]+/u)?.[0].length||0;

 }

 while(node=walker.nextNode()){
   if(node.parentElement.closest('[contenteditable="false"],.md-list-marker,figcaption')||!range.intersectsNode(node))continue;
   const start=node===range.startContainer?range.startOffset:0,end=node===range.endContainer?range.endOffset:node.length;
   if(end>start)parts.push({node,start,end,size:Math.max(8,Math.min(96,Math.round(parseFloat(getComputedStyle(node.parentElement).fontSize))+delta))});
 }

   const span=document.createElement('span'),anchor=document.createTextNode('\u200b');caretAnchors.add(anchor);

 }else{
   for(const part of parts){let text=part.node;if(part.end<text.length)text.splitText(part.end);if(part.start)text=text.splitText(part.start);
     const span=document.createElement('span');span.dataset.textSize=part.size;text.before(span);span.append(text);part.text=text;
   }

 const words={bugun:'today',yarin:'tomorrow','yarindan sonra':'in 2 days','obur gun':'in 2 days','day after tomorrow':'in 2 days','ay sonu':'end of month','next week':'next monday','gelecek hafta':'next monday',haftaya:'next monday'};

function documentHeadings(){
 if(sourceMode()){const list=[];let offset=0,fence=null;for(const line of $('content').value.split('\n')){const f=line.match(/^(`{3,}|~{3,})/);if(f){if(!fence)fence=f[1];else if(f[1][0]===fence[0]&&f[1].length>=fence.length)fence=null}const m=!fence&&line.match(/^(?:\s*- \[[ xX]\] )?(#{1,6})\s+(.*)$/);if(m)list.push({level:m[1].length,text:m[2],offset});offset+=line.length+1}return list}

// One current heading at a time. A clicked heading stays current until the document scrolls away from where

let headingPick=null;

 if(sourceMode()){for(let n=0;n<headings.length;n++)if(headings[n].offset<=$('content').selectionStart)current=n}
 else{
   const pane=document.querySelector('.documentScroll'),ed=$('richEditor'),sel=getSelection(),view=pane.getBoundingClientRect();
   const caret=ed.contains(document.activeElement)&&sel.anchorNode&&ed.contains(sel.anchorNode)?sel.anchorNode:null;
   const block=caret&&[...ed.children].find(c=>c===caret||c.contains(caret)),box=block?.getBoundingClientRect();
   if(headingPick&&headingPick.id===selected&&Math.abs(pane.scrollTop-headingPick.scroll)<=2&&headingPick.index<headings.length&&(!block||block===headingPick.node))current=headingPick.index;
   else{
     headingPick=null;
     if(block&&box.bottom>=view.top&&box.top<=view.bottom){for(let n=0;n<headings.length;n++){const h=headings[n].node;if(h===block||h.compareDocumentPosition(block)&Node.DOCUMENT_POSITION_FOLLOWING)current=n}}
