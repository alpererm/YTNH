name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor-csp-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify installer safety gates
        run: ruby tests/workflow-gates.rb
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ytnh-browser-tests" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/ytnh-browser-tests/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Core browser regressions (Chromium and WebKit)
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ytnh-browser-tests/node_modules/playwright"
          node tests/core-regressions.cjs
  native-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: desktop-tauri-cli-2.12.4
          cache-bin: true
          cache-on-failure: true
      - name: SQLite and portable-master tests
        run: cargo test --locked --manifest-path crates/library/Cargo.toml
      - name: Check shared library for iPhone simulator
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo check --locked --manifest-path crates/library/Cargo.toml --target aarch64-apple-ios-sim
      - name: Native storage tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features inline-images-preview
  build:
    # Both installers require every validation stage to succeed.
    needs: [editor-csp-regressions, native-validation, verify-return]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            name: Windows-current-user
          - os: macos-latest
            bundles: app,dmg
            name: macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: desktop-tauri-cli-2.12.4
          cache-bin: true
          cache-on-failure: true
      # The frontend is self-contained HTML: no npm/pnpm dependencies or install step.
      - name: Install packaging tool
        shell: bash
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -Fxq 'tauri-cli 2.12.4'; then
            cargo install tauri-cli --version 2.12.4 --locked --force
          fi
      - name: Prepare frontend directory
        shell: bash
        run: mkdir -p web
      - name: Configure Windows code signing
        # Windows only, and only when the signing secrets exist; other builds stay unsigned.
        # Imports the certificate into the runner's user store and points Tauri at it, so
        # the app, uninstaller and installer are signed with SHA-256 and timestamped.
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { Write-Output 'Not Windows: no signing.'; exit 0 }
          if (-not $env:PFX_BASE64) { Write-Output '::notice::No signing certificate configured; the installer will be unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'ytnh-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $windows = $config.bundle.windows
          $windows | Add-Member -Force certificateThumbprint $cert.Thumbprint
          $windows | Add-Member -Force digestAlgorithm 'sha256'
          $windows | Add-Member -Force timestampUrl 'http://timestamp.digicert.com'
          $config | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Add-Content $env:GITHUB_ENV
          Write-Output "Signing with certificate $($cert.Subject)"
      - name: Package application
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Verify Windows signatures
        # When signing is configured, the installer and app must carry this certificate's signature.
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or -not $env:SIGNING_THUMBPRINT) { Write-Output 'Unsigned build: nothing to verify.'; exit 0 }
          # Check the installer and the files it installs (app and uninstaller), unpacked with 7-Zip.
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          $inside = Join-Path $env:RUNNER_TEMP 'installer-contents'
          7z x $installer.FullName "-o$inside" -y | Out-Null
          $files = @($installer) + @(Get-ChildItem $inside -Filter *.exe)
          if ($files.Count -lt 3) { throw "Expected the installer, app and uninstaller; found $($files.Count) files" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $env:SIGNING_THUMBPRINT) { throw "Not signed with the YTNH certificate: $($file.Name)" }
            if (-not $sig.TimeStamperCertificate) { throw "Signature has no timestamp: $($file.Name)" }
            Write-Output "Signed: $($file.Name) ($($sig.Status))"
          }
      - name: Smoke test the Windows installer
        # Installs the built installer silently, starts the app and checks it is still running after 20 seconds.
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { Write-Output 'Not Windows: nothing to smoke test.'; exit 0 }
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $setup = Start-Process $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'YTNH') -Filter local-notes-todos.exe -Recurse | Select-Object -First 1
          if (-not $app) { throw 'Installed app not found under %LOCALAPPDATA%\YTNH' }
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "App exited within 20 seconds with code $($process.ExitCode)" }
          Write-Output "App started and kept running: $($app.FullName)"
          Stop-Process -Id $process.Id -Force
          $uninstaller = Get-ChildItem $app.DirectoryName -Filter uninstall.exe | Select-Object -First 1
          if ($uninstaller) { Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait }
      - name: Package and test the Windows portable version
        # A zip with YTNH.exe and a YTNH-data folder: the app keeps all its data in that folder,
        # so it runs without installing. The exe is the signed one from inside the installer.
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { Write-Output 'Not Windows: no portable version.'; exit 0 }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP 'portable-source'
          7z x $installer.FullName "-o$unpacked" -y | Out-Null
          $exe = Get-ChildItem $unpacked -Filter local-notes-todos.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'App executable not found inside the installer' }
          if ($env:SIGNING_THUMBPRINT) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $env:SIGNING_THUMBPRINT) { throw 'Portable app is not signed with the YTNH certificate' }
          }
          $folder = Join-Path $env:RUNNER_TEMP "YTNH-$version-portable"
          New-Item -ItemType Directory -Force (Join-Path $folder 'YTNH-data') | Out-Null
          Copy-Item $exe.FullName (Join-Path $folder 'YTNH.exe')
          Set-Content (Join-Path $folder 'YTNH-data/README.txt') "YTNH portable keeps its working copies, backups and settings in this folder. Keep it next to YTNH.exe; delete it to make YTNH use your user profile instead. Your libraries (.ytnh files) stay wherever you save them."
          # Start it from the folder and check it runs and writes its data next to the exe.
          $process = Start-Process (Join-Path $folder 'YTNH.exe') -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "Portable app exited within 20 seconds with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $folder 'YTNH-data/webview'))) { throw 'Portable app did not keep its WebView data in YTNH-data' }
          Remove-Item -Recurse -Force (Join-Path $folder 'YTNH-data/webview')
          $zip = "src-tauri/target/release/bundle/YTNH_${version}_x64-portable.zip"
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip -Force
          Write-Output "Portable version: $zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/*-portable.zip
  portable-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked --manifest-path crates/library/Cargo.toml --example platform_portable -- send test-parcel
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-mac-portable
          path: test-parcel
          retention-days: 1
  portable-windows:
    needs: portable-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: synthetic-mac-portable
          path: test-parcel
      - run: cargo run --locked --manifest-path crates/library/Cargo.toml --example platform_portable -- reply test-parcel
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-windows-return
          path: test-parcel
          retention-days: 1
  verify-return:
    needs: portable-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: synthetic-windows-return
          path: test-parcel
      - run: cargo run --locked --manifest-path crates/library/Cargo.toml --example platform_portable -- verify test-parcel
