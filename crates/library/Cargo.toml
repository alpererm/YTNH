[package]
name = "yutanohe-library"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
imagesize = { version = "0.14", default-features = false, features = ["gif", "heif", "jpeg", "png", "webp"] }
roxmltree = "0.21"

# Portable masters use stored ZIP64 entries only; no compression or encryption codecs.
zip = { version = "9.6", default-features = false }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
