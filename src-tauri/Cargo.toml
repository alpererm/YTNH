[package]
name = "local-notes-todos"
version = "11.7.0"
description = "Local-first Notes and Todos desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.21"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "rustls"] }
yutanohe-library = { path = "../crates/library" }
fs2 = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = {version="0.62",optional=true,features= ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }
png = {version="0.18",optional=true}

[features]
inline-images-preview = ["dep:reqwest", "dep:windows", "dep:png"]
custom-protocol = ["tauri/custom-protocol"]
